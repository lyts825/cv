<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">计算机视觉与机器学习库综合验证摘要</title>
  <desc id="desc">根据实验说明整理：PyTorch、OpenCV 和 Scikit-learn 均已成功导入并通过基础功能验证。</desc>
  <rect width="1200" height="500" rx="28" fill="#f1f5f9"/>
  <rect x="24" y="24" width="1152" height="452" rx="22" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <text x="64" y="78" fill="#64748b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" letter-spacing="2">CV ENVIRONMENT CHECK</text>
  <text x="64" y="128" fill="#0f172a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">三个库综合验证结果</text>
  <text x="64" y="160" fill="#64748b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">根据实验说明中记录的输出整理</text>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">
    <rect x="64" y="192" width="1072" height="62" rx="12" fill="#f8fafc"/>
    <text x="92" y="232" fill="#0f172a" font-weight="700">PyTorch</text>
    <text x="370" y="232" fill="#475569">2.14.0+cu126</text>
    <circle cx="1010" cy="223" r="7" fill="#16a34a"/>
    <text x="1030" y="232" fill="#166534" font-weight="700">PASS</text>
    <rect x="64" y="270" width="1072" height="62" rx="12" fill="#f8fafc"/>
    <text x="92" y="310" fill="#0f172a" font-weight="700">OpenCV</text>
    <text x="370" y="310" fill="#475569">4.13.0</text>
    <circle cx="1010" cy="301" r="7" fill="#16a34a"/>
    <text x="1030" y="310" fill="#166534" font-weight="700">PASS</text>
    <rect x="64" y="348" width="1072" height="62" rx="12" fill="#f8fafc"/>
    <text x="92" y="388" fill="#0f172a" font-weight="700">Scikit-learn</text>
    <text x="370" y="388" fill="#475569">1.9.0</text>
    <circle cx="1010" cy="379" r="7" fill="#16a34a"/>
    <text x="1030" y="388" fill="#166534" font-weight="700">PASS</text>
  </g>
  <rect x="64" y="428" width="1072" height="32" rx="16" fill="#dcfce7"/>
  <text x="600" y="451" fill="#166534" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ALL IMPORTS: PASS</text>
</svg>
